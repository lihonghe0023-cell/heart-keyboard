  );

    const nextState = typeof next === &quot;function&quot; ? next(state) : next;

      nextState == null ||

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;

    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,

        ),

    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);

        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1

      }

        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,

&lt;style&gt;
#hk-root{
  --hk-pink:#ff4d79;
  --hk-pink-deep:#e01b52;
  --hk-pink-soft:#ffe4ee;
  --hk-screen:#fff7fa;
  --hk-ink:#1c1c1e;
  --hk-sub:#8b8f99;
  --hk-line:#eee6eb;
  --hk-kb:#d3d6de;
  --hk-key:#ffffff;
  --hk-special:#aeb3bf;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  width:100%;
  font-family:-apple-system,BlinkMacSystemFont,&quot;SF Pro Text&quot;,&quot;PingFang SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,sans-serif;
  color:var(--hk-ink);
  -webkit-font-smoothing:antialiased;
}
#hk-root *{box-sizing:border-box;}
.hk-stage{
  width:100%;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:20px 14px 24px;
  border-radius:18px;
}
.hk-phone{
  position:relative;
  width:100%;
  max-width:390px;
  min-height:600px;
  aspect-ratio:390/844;
  padding:11px;
  border-radius:54px;
  background:linear-gradient(160deg,#2b2b32,#15151a 55%,#242429);
  box-shadow:0 26px 54px rgba(24,8,20,.30),0 3px 10px rgba(24,8,20,.22);
}
.hk-screen{
  position:relative;
  display:flex;
  flex-direction:column;
  height:100%;
  overflow:hidden;
  border-radius:43px;
  background:var(--hk-screen);
  container-type:inline-size;
}
.hk-island{
  position:absolute;
  top:9px;
  left:50%;
  transform:translateX(-50%);
  width:100px;
  height:26px;
  border-radius:14px;
  background:#111116;
  z-index:6;
}
.hk-statusbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex:0 0 auto;
  height:48px;
  padding:0 26px 0 30px;
  font-size:13px;
  font-weight:600;
  letter-spacing:.2px;
}
.hk-status-icons{display:flex;align-items:center;gap:5px;}
.hk-bars{display:flex;align-items:flex-end;gap:1.5px;height:10px;}
.hk-bars i{width:3px;border-radius:1px;background:var(--hk-ink);}
.hk-bars i:nth-child(1){height:4px;}
.hk-bars i:nth-child(2){height:6px;}
.hk-bars i:nth-child(3){height:8px;}
.hk-bars i:nth-child(4){height:10px;opacity:.32;}
.hk-net{font-size:10px;font-weight:700;}
.hk-batt{
  position:relative;
  width:23px;height:11px;
  border:1px solid rgba(28,28,30,.42);
  border-radius:3.5px;
  padding:1.5px;
}
.hk-batt::after{
  content:&quot;&quot;;
  position:absolute;top:3px;right:-3px;
  width:2px;height:4px;border-radius:0 1px 1px 0;
  background:rgba(28,28,30,.42);
}
.hk-batt i{display:block;width:62%;height:100%;border-radius:1.5px;background:var(--hk-ink);}
.hk-nav{
  display:flex;
  align-items:center;
  gap:8px;
  flex:0 0 auto;
  height:54px;
  padding:0 12px;
  border-bottom:1px solid var(--hk-line);
  background:rgba(255,255,255,.72);
}
.hk-iconbtn{
  display:flex;align-items:center;justify-content:center;
  width:34px;height:34px;
  border:0;border-radius:50%;
  background:transparent;
  color:var(--hk-pink-deep);
  font-size:22px;line-height:1;
  cursor:pointer;
}
.hk-nav-who{display:flex;align-items:center;gap:9px;flex:1;min-width:0;}
.hk-avatar{
  display:flex;align-items:center;justify-content:center;
  width:36px;height:36px;flex:0 0 auto;
  border-radius:50%;
  background:var(--hk-pink-soft);
  font-size:19px;
}
.hk-nav-text{display:flex;flex-direction:column;min-width:0;}
.hk-nav-text strong{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hk-nav-text small{font-size:11px;color:var(--hk-sub);}
.hk-chat{
  flex:1 1 auto;
  min-height:72px;
  overflow-y:auto;
  padding:12px 14px 6px;
  display:flex;
  flex-direction:column;
  gap:8px;
  position:relative;
  background:linear-gradient(180deg,#fff7fa,#fff2f7 55%,#fde9f1);
  scrollbar-width:thin;
}
.hk-chat::before{
  content:&quot;&quot;;
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(120px 90px at 82% 18%,rgba(255,143,177,.18),transparent 70%),
    radial-gradient(150px 120px at 12% 68%,rgba(255,190,212,.22),transparent 72%);
}
.hk-chat &gt; *{position:relative;}
.hk-chat::-webkit-scrollbar{width:0;}
.hk-day{align-self:center;font-size:10.5px;color:var(--hk-sub);padding:2px 0 4px;}
.hk-msg{display:flex;max-width:82%;}
.hk-msg.ta{align-self:flex-start;}
.hk-msg.me{align-self:flex-end;}
.hk-bub{
  padding:9px 13px;
  font-size:13.5px;
  line-height:1.5;
  border-radius:18px;
  word-break:break-word;
  white-space:pre-wrap;
}
.hk-msg.ta .hk-bub{
  background:#ffffff;
  border:1px solid var(--hk-line);
  border-bottom-left-radius:6px;
}
.hk-msg.me .hk-bub{
  background:linear-gradient(135deg,#ff6d92,#ff3f70);
  color:#fff;
  border-bottom-right-radius:6px;
  box-shadow:0 6px 14px rgba(255,77,121,.26);
}
.hk-typing{display:flex;gap:4px;align-items:center;padding:11px 14px;background:#fff;border:1px solid var(--hk-line);border-radius:18px 18px 18px 6px;}
.hk-typing i{width:5px;height:5px;border-radius:50%;background:#c9b6bf;animation:hk-bounce .9s infinite ease-in-out;}
.hk-typing i:nth-child(2){animation-delay:.15s;}
.hk-typing i:nth-child(3){animation-delay:.3s;}
@keyframes hk-bounce{0%,60%,100%{transform:translateY(0);opacity:.55;}30%{transform:translateY(-3px);opacity:1;}}
.hk-suggest{
  flex:0 0 auto;
  padding:7px 12px 9px;
  border-top:1px solid var(--hk-line);
  background:rgba(255,255,255,.86);
}
.hk-suggest-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;}
.hk-suggest-label{
  font-size:11px;
  font-weight:600;
  color:var(--hk-pink-deep);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.hk-reroll{
  flex:0 0 auto;
  border:1px solid var(--hk-line);
  background:#fff;
  color:var(--hk-pink-deep);
  font-size:11.5px;
  font-weight:500;
  padding:4px 9px;
  border-radius:999px;
  cursor:pointer;
  font-family:inherit;
}
.hk-reroll:active{background:var(--hk-pink-soft);}
.hk-chips{
  display:flex;
  gap:8px;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  padding:1px 1px 3px;
  scrollbar-width:none;
}
.hk-chips::-webkit-scrollbar{height:0;}
.hk-chip{
  flex:0 0 auto;
  width:236px;
  max-width:76%;
  scroll-snap-align:start;
  text-align:left;
  border:1px solid var(--hk-line);
  background:#fff;
  border-radius:14px;
  padding:8px 10px 9px;
  font-family:inherit;
  font-size:12.5px;
  line-height:1.45;
  color:var(--hk-ink);
  cursor:pointer;
  transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease;
}
.hk-chip:active{transform:scale(.98);}
.hk-chip:hover{border-color:#ffc2d5;box-shadow:0 4px 12px rgba(255,77,121,.12);}
.hk-chip-text{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.hk-chip-badge{
  display:inline-block;
  margin-bottom:4px;
  padding:1px 6px;
  border-radius:999px;
  background:var(--hk-pink-soft);
  color:var(--hk-pink-deep);
  font-size:10px;
  font-weight:600;
}
.hk-chip.is-skeleton{height:56px;background:linear-gradient(90deg,#fbf1f5,#f6e6ee,#fbf1f5);animation:hk-shimmer 1.1s infinite linear;background-size:200% 100%;}
@keyframes hk-shimmer{0%{background-position:120% 0;}100%{background-position:-20% 0;}}
.hk-composer{
  display:flex;
  align-items:flex-end;
  gap:8px;
  flex:0 0 auto;
  padding:7px 10px;
  background:#fdf1f6;
  border-top:1px solid var(--hk-line);
}
.hk-field{
  flex:1 1 auto;
  min-height:34px;
  display:flex;
  align-items:center;
  padding:7px 12px;
  border-radius:17px;
  border:1px solid #f2dde6;
  background:#fff;
  font-size:13.5px;
  line-height:1.3;
  overflow:hidden;
  white-space:nowrap;
}
.hk-field.is-empty::before{
  content:&quot;说点什么…&quot;;
  color:#bdb3ba;
}
.hk-caret{
  width:1.5px;
  height:15px;
  margin-left:1px;
  background:var(--hk-pink);
  animation:hk-blink 1.05s steps(1) infinite;
}
@keyframes hk-blink{0%,49%{opacity:1;}50%,100%{opacity:0;}}
.hk-send{
  flex:0 0 auto;
  width:34px;height:34px;
  border:0;border-radius:50%;
  background:#f0d3e0;
  color:#fff;
  font-size:17px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  transition:background .18s ease,transform .12s ease;
}
.hk-send.is-ready{background:var(--hk-pink);}
.hk-send:active{transform:scale(.94);}
.hk-keyboard{
  flex:0 0 auto;
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:8px 4px 2px;
  background:var(--hk-kb);
}
.hk-krow{display:flex;gap:6px;padding:0 1px;}
.hk-key{
  flex:1 1 0;
  min-width:0;
  height:40px;
  border:0;
  border-radius:6px;
  background:var(--hk-key);
  box-shadow:0 1px 0 rgba(26,26,30,.34);
  color:var(--hk-ink);
  font-family:inherit;
  font-size:15px;
  font-size:3.9cqw;
  text-transform:none;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  padding:0;
  transition:background .1s ease,transform .08s ease;
  user-select:none;
}
.hk-key:active{background:#dfe2e8;transform:translateY(1px);}
.hk-key.is-wide{flex-grow:1.45;}
.hk-key.is-special{background:var(--hk-special);color:#1c1c1e;font-size:13px;}
.hk-key.is-special:active{background:#9aa0ad;}
.hk-key.is-space{flex-grow:4.6;font-size:12.5px;color:#4a4d55;}
.hk-key.is-space:active{background:#dfe2e8;}
.hk-key.is-heart{background:linear-gradient(140deg,#ff7ba1,#ff3f70);color:#fff;font-size:15px;flex-grow:1.1;box-shadow:0 1px 0 rgba(190,20,70,.5);}
.hk-key.is-heart:active{background:linear-gradient(140deg,#ff5f8c,#e01b52);}
.hk-key.is-heart.is-pulse{animation:hk-pulse 1.9s ease-in-out infinite;}
@keyframes hk-pulse{0%,100%{box-shadow:0 1px 0 rgba(190,20,70,.5),0 0 0 0 rgba(255,77,121,.55);}50%{box-shadow:0 1px 0 rgba(190,20,70,.5),0 0 0 7px rgba(255,77,121,0);}}
.hk-homebar{
  flex:0 0 auto;
  height:20px;
  display:flex;align-items:center;justify-content:center;
  background:var(--hk-kb);
}
.hk-homebar i{width:124px;height:5px;border-radius:3px;background:#1c1c1e;opacity:.82;}
.hk-toast{
  position:absolute;
  left:50%;
  top:112px;
  transform:translateX(-50%) translateY(6px);
  z-index:9;
  padding:7px 13px;
  border-radius:999px;
  background:rgba(28,28,30,.84);
  color:#fff;
  font-size:11.5px;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s ease,transform .2s ease;
  white-space:nowrap;
}
.hk-toast.is-on{opacity:1;transform:translateX(-50%) translateY(0);}
.hk-backdrop{
  position:absolute;inset:0;z-index:7;
  background:rgba(30,16,24,.30);
  opacity:0;
  transition:opacity .22s ease;
}
.hk-backdrop.is-open{opacity:1;}
.hk-sheet{
  position:absolute;
  left:0;right:0;bottom:0;z-index:8;
  max-height:86%;
  display:flex;
  flex-direction:column;
  padding:8px 16px 20px;
  border-radius:26px 26px 43px 43px;
  background:#fff;
  box-shadow:0 -12px 30px rgba(28,12,22,.16);
  transform:translateY(104%);
  transition:transform .26s cubic-bezier(.32,.72,.24,1);
}
.hk-sheet.is-open{transform:translateY(0);}
.hk-grab{width:38px;height:4px;border-radius:3px;background:#e6dde3;margin:2px auto 10px;}
.hk-sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
.hk-sheet-head strong{font-size:14.5px;font-weight:600;}
.hk-sheet-head span{font-size:11px;color:var(--hk-sub);font-weight:400;margin-left:6px;}
.hk-sheet-body{overflow-y:auto;padding-right:2px;}
.hk-group{margin-bottom:12px;}
.hk-group-label{
  display:block;
  font-size:11px;
  font-weight:600;
  color:var(--hk-sub);
  margin-bottom:6px;
  letter-spacing:.3px;
}
.hk-opts{display:flex;flex-wrap:wrap;gap:7px;}
.hk-opt{
  border:1px solid var(--hk-line);
  background:#fff;
  border-radius:999px;
  padding:6px 11px;
  font-family:inherit;
  font-size:12.5px;
  color:#3c3f46;
  cursor:pointer;
  transition:background .14s ease,border-color .14s ease,color .14s ease;
}
.hk-opt[aria-pressed=&quot;true&quot;]{
  background:var(--hk-pink-soft);
  border-color:#ffb3ca;
  color:var(--hk-pink-deep);
  font-weight:600;
}
.hk-tip{
  display:flex;
  gap:7px;
  padding:9px 11px;
  border-radius:12px;
  background:#fff6f9;
  font-size:11.5px;
  line-height:1.5;
  color:#7a4d5d;
  margin-bottom:12px;
}
.hk-meter{
  display:flex;
  align-items:center;
  gap:12px;
  padding:9px 11px;
  border:1px solid var(--hk-line);
  border-radius:12px;
  margin-bottom:13px;
  font-size:11.5px;
  color:var(--hk-sub);
}
.hk-meter b{color:#3c3f46;font-weight:600;}
.hk-dots{display:flex;gap:3px;align-items:center;}
.hk-dots i{width:7px;height:7px;border-radius:50%;background:#f0dfe6;}
.hk-dots i.on{background:var(--hk-pink);}
.hk-meter .hk-spacer{flex:1;}
.hk-generate{
  width:100%;
  border:0;
  border-radius:15px;
  padding:12px 14px;
  background:linear-gradient(135deg,#ff6d92,#ff3f70);
  color:#fff;
  font-family:inherit;
  font-size:13.5px;
  font-weight:600;
  cursor:pointer;
  box-shadow:0 8px 18px rgba(255,77,121,.28);
}
.hk-generate:active{transform:translateY(1px);}
@media (prefers-reduced-motion:reduce){
  #hk-root *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
}
